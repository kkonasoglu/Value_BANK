<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
  
  <!-- Back Card -->
  <rect x="110" y="140" width="292" height="180" rx="24" fill="url(#cardGrad)" opacity="0.75" transform="rotate(-6 256 230)" />
  
  <!-- Main Wallet Body -->
  <rect x="96" y="170" width="320" height="210" rx="32" fill="url(#emeraldGrad)" />
  
  <!-- Wallet Flap / Detail -->
  <path d="M 96 230 Q 256 260 416 230 L 416 170 Q 256 200 96 170 Z" fill="rgba(255,255,255,0.18)" />
  
  <!-- Wallet Clasp Pocket -->
  <rect x="330" y="245" width="86" height="60" rx="18" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
  <circle cx="360" cy="275" r="10" fill="#38bdf8" />
</svg>